[Unit]
Requires=guest-home.service
After=guest-home.service
# logind makes every session scope require user@1500.service, so the manager, and with it the tmpfs home,
# is stopped by systemd as soon as the last guest session ended. A session that starts meanwhile
# pulls the manager in again, which systemd orders after the stop, so it always gets a fresh home.
StopWhenUnneeded=yes
